<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toán Học Vui Cùng Cú Trí Tuệ</title>
    <!-- Sử dụng thư viện Tailwind CSS trực tiếp -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f8ff; }
        .bounce { animation: bounce 0.5s; }
        .shake { animation: shake 0.5s; }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .btn-answer { transition: all 0.1s; }
        .btn-answer:hover { transform: scale(1.02); }
        .btn-answer:active { transform: translateY(8px); border-bottom-width: 0px; margin-top: 8px; margin-bottom: -8px;}
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-xl w-full max-w-2xl p-8 border-4 border-blue-200 text-center relative overflow-hidden">
        
        <!-- Header -->
        <div class="flex justify-between items-center mb-6">
            <a href="index.html" class="text-blue-500 hover:text-blue-700 font-bold bg-blue-50 hover:bg-blue-100 px-4 py-2 rounded-full transition">&larr; Về trang chủ</a>
            <div class="text-2xl font-bold text-orange-500 bg-orange-50 px-6 py-2 rounded-full border-2 border-orange-200">
                Điểm: <span id="score">0</span>
            </div>
        </div>

        <!-- Mascot & Thông báo -->
        <div class="flex flex-col items-center justify-center mb-6">
            <!-- Tái sử dụng chính file ảnh Cú Trí Tuệ của website -->
            <img src="watermarked_img_5873606537945829463.png" alt="Cú Trí Tuệ" id="mascot" class="h-32 w-auto mb-2 object-contain drop-shadow-md">
            <div id="feedback-msg" class="text-xl font-bold text-blue-400 h-8 mb-2">Hãy chọn đáp án đúng nhé!</div>
            
            <!-- Bảng câu hỏi -->
            <div class="bg-blue-500 text-white text-6xl font-extrabold py-10 px-12 rounded-3xl shadow-lg w-full border-b-8 border-blue-700 mt-2">
                <span id="question">...</span>
            </div>
        </div>

        <!-- Lưới Đáp án -->
        <div class="grid grid-cols-2 gap-4" id="answers-container">
            <!-- Nút bấm được tạo tự động bằng Javascript -->
        </div>

    </div>

    <script>
        let currentCorrectAnswer = 0;
        let score = 0;

        const questionEl = document.getElementById('question');
        const answersContainer = document.getElementById('answers-container');
        const scoreEl = document.getElementById('score');
        const mascot = document.getElementById('mascot');
        const feedbackMsg = document.getElementById('feedback-msg');

        // Hàm tạo số ngẫu nhiên
        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // Tạo câu hỏi mới
        function generateGame() {
            mascot.className = "h-32 w-auto mb-2 object-contain drop-shadow-md";
            
            // Lựa chọn phép toán ngẫu nhiên: 0(Cộng), 1(Trừ), 2(Nhân)
            const opType = getRandomInt(0, 2);
            let num1, num2, operatorStr;

            if (opType === 0) { 
                // Phép Cộng
                num1 = getRandomInt(10, 50);
                num2 = getRandomInt(10, 49);
                operatorStr = '+';
                currentCorrectAnswer = num1 + num2;
            } else if (opType === 1) { 
                // Phép Trừ (đảm bảo số bị trừ lớn hơn số trừ)
                num1 = getRandomInt(20, 99);
                num2 = getRandomInt(1, num1 - 1); 
                operatorStr = '-';
                currentCorrectAnswer = num1 - num2;
            } else { 
                // Phép Nhân (bảng cửu chương cơ bản)
                num1 = getRandomInt(2, 9);
                num2 = getRandomInt(2, 10);
                operatorStr = 'x';
                currentCorrectAnswer = num1 * num2;
            }

            questionEl.innerText = `${num1} ${operatorStr} ${num2} = ?`;

            // Tạo 3 đáp án nhiễu (sai)
            let answers = [currentCorrectAnswer];
            while (answers.length < 4) {
                let offset = getRandomInt(-10, 10);
                if (offset === 0) offset = 1;
                let fakeAns = currentCorrectAnswer + offset;
                // Đảm bảo không trùng và không âm
                if (fakeAns >= 0 && !answers.includes(fakeAns)) {
                    answers.push(fakeAns);
                }
            }

            // Đảo lộn vị trí đáp án
            answers.sort(() => Math.random() - 0.5);

            // Hiển thị nút bấm
            answersContainer.innerHTML = '';
            const colors = [
                'bg-orange-400 border-orange-600', 
                'bg-green-400 border-green-600', 
                'bg-pink-400 border-pink-600', 
                'bg-purple-400 border-purple-600'
            ];
            
            answers.forEach((ans, index) => {
                const btn = document.createElement('button');
                btn.className = `btn-answer text-4xl font-bold text-white py-6 rounded-2xl shadow-md border-b-8 ${colors[index]} focus:outline-none`;
                btn.innerText = ans;
                btn.onclick = () => checkAnswer(ans);
                answersContainer.appendChild(btn);
            });
        }

        // Kiểm tra kết quả
        function checkAnswer(selected) {
            // Vô hiệu hóa nút trong lúc chờ
            const buttons = document.querySelectorAll('.btn-answer');
            buttons.forEach(btn => btn.disabled = true);

            if (selected === currentCorrectAnswer) {
                // Đúng
                score += 10;
                scoreEl.innerText = score;
                mascot.classList.add('bounce');
                feedbackMsg.innerText = "Hoan hô! Bạn tính giỏi quá!";
                feedbackMsg.className = "text-xl font-bold text-green-500 h-8 mb-2";
                
                setTimeout(() => {
                    feedbackMsg.innerText = "Câu tiếp theo nào!";
                    feedbackMsg.className = "text-xl font-bold text-blue-400 h-8 mb-2";
                    generateGame();
                }, 1500);
            } else {
                // Sai
                mascot.classList.add('shake');
                feedbackMsg.innerText = "Chưa đúng rồi, thử lại nhé!";
                feedbackMsg.className = "text-xl font-bold text-red-500 h-8 mb-2";
                
                setTimeout(() => {
                    mascot.classList.remove('shake');
                    buttons.forEach(btn => btn.disabled = false); // Mở lại nút để bấm lại
                }, 800);
            }
        }

        // Khởi động câu đầu tiên
        generateGame();
    </script>
</body>
</html>
